<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03050a"><title>AHIA Follow</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#03050a;color:white;font-family:Arial,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5vh 14px 4vh;background:radial-gradient(ellipse at 50% 75%,#063c78 0%,#071321 38%,#03050a 76%)}
h1{margin:1vh 0 0;text-align:center;font-size:clamp(38px,11vw,58px);font-weight:1000;letter-spacing:2px;font-style:italic;color:#dcecff;text-shadow:0 0 8px #008cff,0 0 24px #005eff}
h1 span{color:#08aaff}.hero{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;height:100%;max-height:72vh;object-fit:contain}
button{width:min(88%,360px);padding:17px 24px;border-radius:999px;border:2px solid #168dff;background:#020711;color:white;font-size:28px;font-weight:900;font-style:italic;letter-spacing:2px;box-shadow:0 0 12px #008cff,0 0 28px #005eff88}
#msg{min-height:22px;color:#b8dfff;font-size:13px;margin-top:10px;text-align:center}
</style></head><body><main>
<h1>AHIA <span>FOLLOW</span></h1>
<div class="hero"><img src="tiger-splash.png" alt="Tiger"></div>
<div style="width:100%;display:flex;flex-direction:column;align-items:center">
<button onclick="document.getElementById('msg').textContent='Welcome to AHIA Follow'">START</button>
<div id="msg" aria-live="polite"></div></div>
</main></body></html>
