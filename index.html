
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHIA FOLLOW SELLER</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080808;color:white;
  font-family:Arial,sans-serif;
  padding:25px 16px;
}
.container{max-width:420px;margin:35px auto}
h1{text-align:center;color:#c084fc}
.subtitle{text-align:center;color:#aaa}
.card{
  background:#171717;padding:24px;
  border:1px solid #333;border-radius:16px;
  margin-top:25px;
}
h2{color:#c084fc}
input{
  width:100%;padding:14px;margin:9px 0;
  background:#252525;color:white;
  border:1px solid #444;border-radius:8px;
  font-size:16px;
}
button{
  width:100%;padding:14px;margin-top:12px;
  background:#9333ea;color:white;
  border:0;border-radius:9px;
  font-size:16px;font-weight:bold;
}
.note{color:#999;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="container">

<h1>AHIA FOLLOW SELLER</h1>
<p class="subtitle">Welcome to our official website</p>

<div class="card">
<h2>Register</h2>
<form onsubmit="event.preventDefault();alert('Demo only: Registration service is not connected yet.')">
<input type="text" placeholder="Full Name" required>
<input type="tel" placeholder="Mobile Number" pattern="[0-9]{10}" required>
<button type="submit">REGISTER</button>
</form>
</div>

<div class="card">
<h2>OTP Login</h2>
<form onsubmit="event.preventDefault();alert('OTP service is not connected yet.')">
<input type="tel" placeholder="Enter Mobile Number" pattern="[0-9]{10}" required>
<button type="submit">SEND OTP</button>
</form>
<p class="note">Secure OTP verification will be added later.</p>
</div>

<div class="card">
<h2>Order Now</h2>
<p class="note">Explore our services and contact us for details.</p>
<button onclick="alert('Order service coming soon!')">ORDER NOW</button>
</div>

</div>
</body>
</html>
